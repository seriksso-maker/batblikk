name = "batblikk"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Kartet (index.html + Leaflet) serveres som statiske filer
[assets]
directory = "./public"
binding = "ASSETS"

# Én Durable Object holder TCP-tilkoblingen til Kystverket åpen hele tiden
[[durable_objects.bindings]]
name = "AIS_HUB"
class_name = "AisHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AisHub"]

[vars]
AIS_HOST = "153.44.253.27"
AIS_PORT = "5631"
