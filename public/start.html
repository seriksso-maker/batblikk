<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050d1c">
<title>SkyPuls og SeaPuls</title>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Live kart">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  :root{--bg:#050d1c;--fg:#e6eef4;--mute:#7f93ab}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 'Barlow',system-ui,sans-serif}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));background:radial-gradient(70% 50% at 50% 20%,#0b2350 0,transparent 70%),radial-gradient(70% 50% at 50% 85%,#0a3438 0,transparent 70%),var(--bg)}
  .apps{display:grid;gap:18px;width:min(100%,560px)}
  @media (min-width:1000px) and (min-height:520px){.apps{grid-template-columns:1fr 1fr;width:min(100%,1180px)}}
  a.app{display:block;position:relative;border-radius:5.2%/7.5%;overflow:hidden;transition:transform .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent}
  a.app img{display:block;width:100%;height:auto}
  a.app::after{content:attr(data-cta);position:absolute;left:5.5%;bottom:9%;font:600 13px 'Barlow',sans-serif;letter-spacing:.04em;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(4px);color:#fff}
  a.sky{box-shadow:0 0 0 1px rgba(90,150,255,.35),0 12px 40px rgba(20,80,200,.25)}
  a.sea{box-shadow:0 0 0 1px rgba(90,220,200,.35),0 12px 40px rgba(20,160,150,.22)}
  a.app:hover,a.app:focus-visible{transform:translateY(-3px);outline:none}
  a.sky:hover,a.sky:focus-visible{box-shadow:0 0 0 2px #5a9bff,0 16px 50px rgba(40,110,255,.45)}
  a.sea:hover,a.sea:focus-visible{box-shadow:0 0 0 2px #5fe3cc,0 16px 50px rgba(40,200,180,.4)}
  .remember{color:var(--mute);font-size:14px;display:inline-flex;gap:8px;align-items:center;cursor:pointer}
  .remember input{accent-color:#5fe3cc;width:18px;height:18px}
  footer{color:var(--mute);font-size:13px;text-align:center;line-height:1.6}
  footer b{color:#c9d6e3;font-weight:600}
</style>
</head>
<body>
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Velg kart</h1>
  <div class="apps">
    <a class="app sky" href="https://seriksso-maker.github.io/flyradar/" data-app="fly" data-cta="Åpne flykartet ›"><img src="start-sky.jpg" alt="SkyPuls – flytrafikk i sanntid" width="749" height="413"></a>
    <a class="app sea" href="./" data-app="sea" data-cta="Åpne skipskartet ›"><img src="start-sea.jpg" alt="SeaPuls – skipstrafikk i sanntid" width="749" height="413"></a>
  </div>
  <label class="remember"><input type="checkbox" id="rem">Husk valget mitt neste gang</label>
  <footer>Utviklet av <b>Grøtbekklia AS</b><br>Versjon 1.0.0</footer>
<script>
  const KEY = "livekart.valg";
  const get = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
  const set = v => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} };
  const links = { sea: document.querySelector("[data-app=sea]").href, fly: document.querySelector("[data-app=fly]").href };
  // ?velg viser alltid valget (for å kunne bytte), ellers hopp rett til husket app
  const saved = get();
  if (saved && links[saved] && !new URLSearchParams(location.search).has("velg")) location.replace(links[saved]);
  document.getElementById("rem").checked = !!saved;
  document.getElementById("rem").onchange = e => { if (!e.target.checked) set(null); };
  for (const a of document.querySelectorAll("a.app")) a.addEventListener("click", () => { if (document.getElementById("rem").checked) set(a.dataset.app); });
</script>
</body>
</html>
