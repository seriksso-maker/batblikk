<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Båtblikk</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#14202b; --muted:#5b6b78; --line:#dde3e8; --panel:rgba(255,255,255,.95); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f171e; --fg:#e6edf3; --muted:#93a3b1; --line:#26333e; --panel:rgba(18,27,35,.95); } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #map { position:absolute; inset:0; }
  #panel { position:absolute; z-index:1000; top:12px; left:12px; width:260px; max-width:calc(100vw - 48px);
           background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; box-shadow:0 2px 12px rgba(0,0,0,.15); }
  h1 { font-size:17px; margin:0 0 2px; }
  #status { color:var(--muted); font-size:12px; margin-bottom:10px; }
  #status b { color:var(--fg); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#c33; margin-right:5px; vertical-align:middle; }
  .dot.on { background:#2a9d4b; }
  input[type=search] { width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); margin-bottom:8px; }
  .cats label { display:flex; align-items:center; gap:6px; padding:2px 0; cursor:pointer; }
  .cats .sw { width:18px; height:18px; flex:none; display:inline-flex; align-items:center; justify-content:center; }
  .cats .sw svg { overflow:visible; }
  #tracking { display:none; margin:0 0 8px; padding:6px 8px; border-radius:6px; background:rgba(230,57,70,.12); font-size:12px; align-items:center; gap:6px; }
  #tracking.on { display:flex; }
  #tracking button { margin-left:auto; border:0; background:none; color:var(--fg); cursor:pointer; font-size:14px; }
  .acts { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .acts button { font:inherit; font-size:12px; padding:4px 9px; border-radius:5px; border:1px solid #c9d3da; background:#f3f6f8; color:#14202b; cursor:pointer; }
  .acts button.on { background:#e63946; border-color:#e63946; color:#fff; }
  .cats .n { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
  #toggle { display:none; }
  @media (max-width:600px) { #panel.collapsed .body { display:none; } #toggle { display:inline; float:right; border:0; background:none; color:var(--fg); font-size:16px; } }
  .ship-icon { background:none; border:0; }
  .leaflet-popup-content { font-size:13px; width:240px; }
  .photo { display:block; margin:-2px 0 8px; }
  .photo img { display:block; width:100%; height:150px; object-fit:cover; border-radius:6px; background:#e6ebef; }
  .photo.none { font-size:12px; color:#5b6b78; padding:8px 10px; background:rgba(127,140,150,.12); border-radius:6px; }
  .credit { font-size:10.5px; color:#7c8a96; margin:-5px 0 6px; }
  .leaflet-popup-content table td:first-child { color:#5b6b78; padding-right:8px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <button id="toggle" aria-label="Vis/skjul">☰</button>
  <h1>Båtblikk</h1>
  <div id="status"><span class="dot"></span>Kobler til …</div>
  <div id="tracking"><span>📍</span><span id="tracking-name"></span><button id="tracking-stop" aria-label="Slutt å spore">✕</button></div>
  <div class="body">
    <input id="q" type="search" placeholder="Søk på navn eller MMSI">
    <div class="cats" id="cats"></div>
  </div>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script>
const CATS = [
  { id:"passenger", label:"Passasjer / ferje", color:"#1f77d0", test:t=>t>=60&&t<70 },
  { id:"cargo",     label:"Last",              color:"#2a9d4b", test:t=>t>=70&&t<80 },
  { id:"tanker",    label:"Tank",              color:"#d0392b", test:t=>t>=80&&t<90 },
  { id:"fishing",   label:"Fiske",             color:"#e08a00", test:t=>t===30 },
  { id:"leisure",   label:"Fritid / seil",     color:"#9b51c9", test:t=>t===36||t===37 },
  { id:"service",   label:"Slep, los, redning", color:"#11a3a3", test:t=>(t>=31&&t<=35)||(t>=50&&t<60) },
  { id:"fast",      label:"Hurtigbåt",         color:"#e0489a", test:t=>t>=40&&t<50 },
  { id:"other",     label:"Annet / ukjent",    color:"#7c8a96", test:()=>true },
];
const TYPE_NAMES = {30:"Fiskefartøy",31:"Slep",32:"Slep",33:"Mudring",34:"Dykking",35:"Militær",36:"Seilbåt",37:"Fritidsbåt",50:"Losbåt",51:"Redning",52:"Slepebåt",53:"Havnefartøy",54:"Miljøvern",55:"Politi",58:"Ambulanse"};
const STATUS = ["Under gange (motor)","Til ankers","Ikke manøvrerbar","Begrenset manøvrering","Begrenset av dypgang","Fortøyd","På grunn","Fiske","Under seil"];

const catOf = t => CATS.find(c => t != null && c.test(t)) || CATS[CATS.length-1];
const typeName = t => t==null ? "Ukjent" : TYPE_NAMES[t] || (t>=40&&t<50?"Hurtigbåt":t>=60&&t<70?"Passasjer":t>=70&&t<80?"Lasteskip":t>=80&&t<90?"Tankskip":`Type ${t}`);

const map = L.map("map", { zoomControl:false }).setView([64.5, 12], 5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · AIS: Kystverket (NLOD)'
}).addTo(map);
L.control.zoom({ position:"bottomright" }).addTo(map);

const enabled = new Set(CATS.map(c => c.id));
const markers = new Map(); // mmsi -> { marker, key }
let ships = [];
let query = "";

// Ovenfra-silhuetter, baugen peker opp (roteres etter kurs). viewBox -12..12.
const SHAPES = {
  cargo:   `<path d="M0,-11 L4,-6 L4,10 L-4,10 L-4,-6 Z"/><g fill="#fff" fill-opacity=".55" stroke="none"><rect x="-2.6" y="-4.5" width="5.2" height="3.2"/><rect x="-2.6" y="-0.4" width="5.2" height="3.2"/><rect x="-2.6" y="3.7" width="5.2" height="3.2"/></g>`,
  tanker:  `<path d="M0,-11 C3.5,-9 4,-6 4,-4 L4,9 Q4,10.5 2.5,10.5 L-2.5,10.5 Q-4,10.5 -4,9 L-4,-4 C-4,-6 -3.5,-9 0,-11 Z"/><g fill="#fff" fill-opacity=".6" stroke="none"><circle cy="-3" r="1.7"/><circle cy="1.5" r="1.7"/><circle cy="6" r="1.7"/></g>`,
  passenger:`<path d="M-4.5,-7 Q0,-12 4.5,-7 L4.5,7 Q0,12 -4.5,7 Z"/><g fill="#fff" fill-opacity=".6" stroke="none"><rect x="-2.8" y="-5" width="5.6" height="2.2" rx=".6"/><rect x="-2.8" y="-1.1" width="5.6" height="2.2" rx=".6"/><rect x="-2.8" y="2.8" width="5.6" height="2.2" rx=".6"/></g>`,
  fishing: `<path d="M0,-8 L3.5,-3 L3.5,7 L-3.5,7 L-3.5,-3 Z"/><path d="M-7,-5 L0,1 L7,-5" fill="none" stroke-width="1.4"/><circle cy="1" r="1.3" fill="#fff" stroke="none"/>`,
  leisure: `<path d="M0,-8 L2.6,-3 L2.6,7 L-2.6,7 L-2.6,-3 Z"/><path d="M0.6,-6 L0.6,5 L6,3.5 Z" fill="#fff" fill-opacity=".85"/>`,
  service: `<path d="M0,-7.5 Q4.5,-6.5 4.5,-2 L4.5,6 Q4.5,7.5 3,7.5 L-3,7.5 Q-4.5,7.5 -4.5,6 L-4.5,-2 Q-4.5,-6.5 0,-7.5 Z"/><circle cy="0.5" r="2.2" fill="#fff" fill-opacity=".7" stroke="none"/>`,
  fast:    `<path d="M-3,-10 L-1.4,-5 L-1.4,8 L-4.6,8 L-4.6,-5 Z M3,-10 L4.6,-5 L4.6,8 L1.4,8 L1.4,-5 Z"/><rect x="-4.6" y="-1" width="9.2" height="5" rx="1"/>`,
  other:   `<path d="M0,-9 L5,8 L0,5 L-5,8 Z"/>`,
};
function shipSvg(catId, color, size, rot, faded) {
  return `<svg width="${size}" height="${size}" viewBox="-12 -12 24 24" style="transform:rotate(${rot}deg) scaleX(1.25)${faded ? ";opacity:.6" : ""}"><g fill="${color}" stroke="#fff" stroke-width="1.1" stroke-linejoin="round">${SHAPES[catId]}</g></svg>`;
}
function iconFor(s, cat) {
  const moving = s.sog != null && s.sog > 0.5;
  const hdg = s.heading ?? (moving ? s.cog : null);
  const rot = Math.round(hdg ?? 0);
  const tracked = tracking && tracking.mmsi === s.mmsi;
  const z = map.getZoom(), zb = z <= 6 ? 0 : z <= 9 ? 1 : 2;
  const size = [[20, 16], [30, 24], [40, 32]][zb][moving ? 0 : 1] + (tracked ? 8 : 0);
  const color = tracked ? "#e63946" : cat.color;
  return { key: `${cat.id}|${moving}|${Math.round(rot/5)}|${tracked}|${zb}`,
    icon: L.divIcon({ className:"ship-icon", html:shipSvg(cat.id, color, size, rot, !moving && !tracked), iconSize:[size,size], iconAnchor:[size/2,size/2] }) };
}

function esc(v) { return String(v).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ago(ms) { const s = Math.round(ms/1000); return s < 60 ? `${s} s siden` : `${Math.round(s/60)} min siden`; }

function popupHtml(s, now) {
  const rows = [
    ["Type", typeName(s.shipType)],
    ["MMSI", s.mmsi],
    s.imo && ["IMO", s.imo],
    s.callsign && ["Kallesignal", s.callsign],
    s.sog != null && ["Fart", `${s.sog.toFixed(1)} knop`],
    s.cog != null && ["Kurs", `${Math.round(s.cog)}°`],
    s.status != null && STATUS[s.status] && ["Status", STATUS[s.status]],
    s.destination && ["Destinasjon", s.destination],
    ["Sist sett", ago(now - s.seen)],
  ].filter(Boolean);
  const on = tracking && tracking.mmsi === s.mmsi;
  const acts = `<div class="acts"><button type="button" data-act="track" data-mmsi="${s.mmsi}" class="${on ? "on" : ""}">${on ? "Slutt å spore" : "Spor ruten"}</button>${on ? `<button type="button" data-act="follow" class="${tracking.follow ? "on" : ""}">${tracking.follow ? "Følger båten" : "Følg båten"}</button>` : ""}</div>`;
  return `${photoHtml(s)}<b>${esc(s.name || "Ukjent navn")}</b><table>${rows.map(([k,v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table>${acts}`;
}

function matches(s) {
  if (!query) return true;
  return (s.name || "").toLowerCase().includes(query) || String(s.mmsi).includes(query);
}

function render(now) {
  const counts = Object.fromEntries(CATS.map(c => [c.id, 0]));
  const seen = new Set();
  let shown = 0;
  for (const s of ships) {
    const cat = catOf(s.shipType);
    counts[cat.id]++;
    const isTracked = tracking && tracking.mmsi === s.mmsi;
    if (!isTracked && (!enabled.has(cat.id) || !matches(s))) continue;
    seen.add(s.mmsi); shown++;
    const { key, icon } = iconFor(s, cat);
    let m = markers.get(s.mmsi);
    if (!m) {
      const marker = L.marker([s.lat, s.lon], { icon, title: s.name || String(s.mmsi) }).addTo(map);
      marker.bindPopup("");
      m = { marker, key }; markers.set(s.mmsi, m);
    } else {
      m.marker.setLatLng([s.lat, s.lon]);
      if (m.key !== key) { m.marker.setIcon(icon); m.key = key; }
    }
    m.ship = s;
    if (m.marker.isPopupOpen()) m.marker.setPopupContent(popupHtml(s, now));
  }
  for (const [mmsi, m] of markers) if (!seen.has(mmsi)) { m.marker.remove(); markers.delete(mmsi); }
  for (const c of CATS) document.getElementById("n-" + c.id).textContent = counts[c.id];
  return shown;
}

map.on("popupopen", e => {
  for (const m of markers.values()) if (m.marker === e.popup._source) {
    e.popup.setContent(popupHtml(m.ship, Date.now()));
    findPhoto(m.ship).then(() => { if (m.marker.isPopupOpen()) m.marker.setPopupContent(popupHtml(m.ship, Date.now())); });
  }
});

// ---- Bilder fra Wikimedia Commons, slått opp i Wikidata på MMSI eller IMO ----
const photos = new Map(); // mmsi -> undefined (ikke sjekket) | "loading" | null (ingen) | { url, page }
async function findPhoto(s) {
  const key = s.mmsi + ":" + (s.imo || "");
  if (photos.has(key) && photos.get(key) !== "loading") return;
  if (photos.get(key) === "loading") return;
  photos.set(key, "loading");
  const ids = [`{ ?item wdt:P587 "${Number(s.mmsi)}" }`];
  if (s.imo) ids.push(`{ ?item wdt:P458 "${Number(s.imo)}" }`);
  const q = `SELECT ?img WHERE { ${ids.join(" UNION ")} ?item wdt:P18 ?img } LIMIT 1`;
  try {
    const r = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(q));
    const b = (await r.json()).results.bindings[0];
    if (!b) { photos.set(key, null); return; }
    const file = decodeURIComponent(b.img.value.split("/Special:FilePath/")[1]);
    photos.set(key, {
      url: "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(file) + "?width=360",
      page: "https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(file.replace(/ /g, "_")),
    });
  } catch { photos.set(key, null); }
}
function photoHtml(s) {
  const p = photos.get(s.mmsi + ":" + (s.imo || ""));
  if (p === undefined || p === "loading") return `<div class="photo none">Ser etter bilde …</div>`;
  if (p === null) return `<div class="photo none">Fant ikke noe fritt bilde. <a href="https://www.marinetraffic.com/en/ais/details/ships/mmsi:${Number(s.mmsi)}" target="_blank" rel="noopener">Se på MarineTraffic</a></div>`;
  return `<a class="photo" href="${p.page}" target="_blank" rel="noopener"><img src="${p.url}" alt="${esc(s.name || "Båt")}" loading="lazy"></a><div class="credit">Bilde: Wikimedia Commons</div>`;
}

document.getElementById("cats").innerHTML = CATS.map(c =>
  `<label><input type="checkbox" data-id="${c.id}" checked><span class="sw">${shipSvg(c.id, c.color, 18, 0, false)}</span>${c.label}<span class="n" id="n-${c.id}">0</span></label>`).join("");
document.getElementById("cats").addEventListener("change", e => {
  const id = e.target.dataset.id; e.target.checked ? enabled.add(id) : enabled.delete(id); render(Date.now());
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(Date.now()); });
document.getElementById("toggle").addEventListener("click", () => document.getElementById("panel").classList.toggle("collapsed"));

// ---- Sporing av rute ----
let tracking = null; // { mmsi, name, line, follow }
async function updateTrack() {
  if (!tracking) return;
  const t = tracking;
  try {
    const pts = await fetch("api/track?mmsi=" + t.mmsi, { cache: "no-store" }).then(r => r.json());
    if (tracking !== t) return;
    const s = ships.find(x => x.mmsi === t.mmsi);
    const latlngs = pts.map(p => [p[0], p[1]]);
    if (s) latlngs.push([s.lat, s.lon]);
    t.line.setLatLngs(latlngs);
    if (s && t.follow) map.panTo([s.lat, s.lon], { animate: true });
  } catch {}
}
function startTracking(mmsi) {
  stopTracking();
  const s = ships.find(x => x.mmsi === mmsi);
  tracking = { mmsi, name: (s && s.name) || String(mmsi), follow: false,
    line: L.polyline([], { color:"#e63946", weight:3, opacity:.85, dashArray:"6 5" }).addTo(map) };
  document.getElementById("tracking-name").textContent = "Sporer " + tracking.name;
  document.getElementById("tracking").classList.add("on");
  updateTrack(); render(Date.now());
}
function stopTracking() {
  if (!tracking) return;
  tracking.line.remove(); tracking = null;
  document.getElementById("tracking").classList.remove("on");
  render(Date.now());
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "track") {
    const mmsi = Number(b.dataset.mmsi);
    tracking && tracking.mmsi === mmsi ? stopTracking() : startTracking(mmsi);
  } else if (b.dataset.act === "follow" && tracking) {
    tracking.follow = !tracking.follow; updateTrack();
  }
  const m = tracking ? markers.get(tracking.mmsi) : null;
  for (const mk of markers.values()) if (mk.marker.isPopupOpen()) mk.marker.setPopupContent(popupHtml(mk.ship, Date.now()));
});
document.getElementById("tracking-stop").addEventListener("click", stopTracking);
map.on("zoomend", () => render(Date.now()));

async function poll() {
  const st = document.getElementById("status");
  try {
    const r = await fetch("api/ships", { cache: "no-store" });
    const data = await r.json();
    ships = data.ships;
    const shown = render(data.now);
    updateTrack();
    const src = data.stats.source === "demo" ? "demo (simulert)" : "Kystverket";
    const st2 = data.stats, fresh = Math.max(st2.lastData || 0, st2.lastRelay || 0);
    const on = st2.connected || data.now - fresh < 20000;
    st.innerHTML = `<span class="dot ${on ? "on" : ""}"></span><b>${shown}</b> båter vist · ${src}${on ? "" : " · frakoblet"}`;
  } catch (e) {
    st.innerHTML = `<span class="dot"></span>Får ikke kontakt med serveren`;
  }
}
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
